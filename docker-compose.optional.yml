# OPTIONAL — not used for offline / pgAdmin setups.
# Prefer local PostgreSQL 18 (see README + backend/setup_pgadmin*.sql).
#
# To use Docker instead:
#   docker compose -f docker-compose.optional.yml up -d
#   and set DB_PORT=5433 in backend/.env
#
# MinIO (file storage for drawings / PL / WL):
#   http://localhost:9000  (API)   http://localhost:9001  (console)
#   Credentials: admin / password123
#   App falls back to local uploads/ if MinIO is unreachable.

services:
  postgres:
    image: postgres:16-alpine
    container_name: route-card-postgres
    environment:
      POSTGRES_DB: route_card
      POSTGRES_USER: route_card
      POSTGRES_PASSWORD: route_card
    ports:
      - "5433:5432"
    volumes:
      - route_card_pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: route-card-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - route_card_minio:/data

volumes:
  route_card_pgdata:
  route_card_minio:
